{{define "admin_posts"}}{{template "admin_head" .}}
<div class="actions">
  <a href="/admin/posts/new"><button type="button">New post</button></a>
</div>
<table class="admin-table">
  <thead>
    <tr><th>Title</th><th>Status</th><th>Date</th><th>Tags</th><th></th></tr>
  </thead>
  <tbody>
    {{range .Posts}}
    <tr>
      <td><a href="/admin/posts/{{.ID}}">{{.Title}}</a></td>
      <td>{{.Status}}</td>
      <td>{{.Date}}</td>
      <td>{{range .Tags}}<span class="tag-chip">{{.Name}}</span>{{end}}</td>
      <td class="row-actions">
        <a href="/admin/posts/{{.ID}}">Edit</a>
        {{if eq .Status "published"}}
        <form method="post" action="/admin/posts/{{.ID}}/unpublish"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button class="link" type="submit">Unpublish</button></form>
        {{else}}
        <form method="post" action="/admin/posts/{{.ID}}/publish"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button class="link" type="submit">Publish</button></form>
        {{end}}
        <form method="post" action="/admin/posts/{{.ID}}/delete"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><button class="link" type="submit">Delete</button></form>
      </td>
    </tr>
    {{else}}
    <tr><td colspan="5">No posts yet.</td></tr>
    {{end}}
  </tbody>
</table>
{{template "admin_foot" .}}{{end}}
